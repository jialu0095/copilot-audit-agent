[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-audit-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "github-copilot-sdk",
  "python-docx",
  "pypdf",
  "typer",
  "rich",
  "openpyxl"
]

[project.scripts]
audit = "cli:main"

# --- inform setuptools about the modules needed 
[tool.setuptools]
packages = ["parsers", "templates"]
py-modules = ["cli", "agent"]