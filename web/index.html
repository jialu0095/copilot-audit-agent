<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Governance Audit Generator</title>

  <style>
    /* Simple loading styles */
    #running {
      display: none;
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #ddd;
      background: #fafafa;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 4px solid #ddd;
      border-top: 4px solid #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <h1>Governance Audit Generator</h1>

  <!-- Add an id to the form -->
  <form id="genForm" action="/generate" method="post" enctype="multipart/form-data">

    <p>
      <label>Select files (multiple allowed)</label><br>
      <input type="file" name="files" multiple required>
    </p>

    <p>
      <label>Model</label><br>
      <input type="text" name="model" value="gpt-5">
    </p>

    <p>
      <label>
        <input type="checkbox" name="verbose">
        Verbose
      </label>
    </p>

    <button type="submit">Generate report.md</button>

  </form>

  <!-- Running indicator -->
  <div id="running">
    <h3>⏳ Generating Reports…</h3>
    <p>Please don't leave, this might take a while</p>
    <div class="spinner"></div>
  </div>

  <!-- JS: switch UI on submit -->
  <script>
    const form = document.getElementById("genForm");
    const running = document.getElementById("running");

    form.addEventListener("submit", () => {
      // Hide the form
      form.style.display = "none";
      // Show the running indicator
      running.style.display = "block";
    });
  </script>

</body>
</html>
